# 프로덕션(RPi) docker-compose — GHCR 이미지 기반
# 배포 워크플로우가 이 파일을 RPi ~/eattable/docker-compose.yml 로 동기화한다.
# 빌드는 GitHub Actions(arm64 러너)에서 수행하고, RPi는 pull만 한다.
#
# RPi 로컬에 필요한 것 (git 미포함):
#   - .env.production : 런타임 시크릿 (DB_PASSWORD, JWT_SECRET, KAKAO_CLIENT_SECRET 등)
#   - DB_PASSWORD, CLOUDFLARE_TUNNEL_TOKEN : compose 변수 (RPi의 .env 또는 셸 환경)

services:
  postgres:
    image: postgres:17-alpine
    container_name: eattable-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: honbabnono
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "0.0.0.0:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/leegyeongyoon/eattable-app:latest
    container_name: eattable-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    # 런타임 시크릿 주입 — 이미지엔 .env.production이 없으므로 이 볼륨이 제공한다.
    volumes:
      - ./.env.production:/app/.env.production:ro
    ports:
      - "80:80"
    depends_on:
      postgres:
        condition: service_healthy
    # autoheal이 감지할 수 있도록 헬스체크 + 라벨.
    # 컨테이너가 "살아있지만 API 다운"(좀비) 상태여도 unhealthy → autoheal이 재시작.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - autoheal=true

  # unhealthy 컨테이너 자동 재시작 (restart 정책이 못 잡는 좀비 상태 대응)
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: eattable-autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: eattable-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    network_mode: host
    depends_on:
      - app

volumes:
  pgdata:
