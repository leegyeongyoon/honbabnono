name: DB Migrate (Manual)

# 프로덕션 RPi 컨테이너에서 마이그레이션 상태 확인/실행 (수동 트리거 전용)
# 배경: server/start.js는 부팅 시 마이그레이션 실패를 삼키고 계속 부팅하므로,
#       실패 시 이 워크플로우로 원인 확인 후 수동 적용한다.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: '마이그레이션 실행 여부 (false면 상태/로그만 확인)'
        type: boolean
        default: false
      recover_v2:
        description: 'v2 마이그레이션(100~107) 직접 적용+기록 — 005 레거시 충돌 우회용 (전부 멱등)'
        type: boolean
        default: false
      sync_and_apply:
        description: '최신 migrations 폴더를 컨테이너에 주입 후 runner 실행 (배포 없이 마이그레이션만)'
        type: boolean
        default: false

jobs:
  migrate:
    name: Migrate on Raspberry Pi
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      if: ${{ inputs.sync_and_apply }}
      uses: actions/checkout@v4

    - name: Install cloudflared
      run: |
        curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
        sudo dpkg -i cloudflared.deb

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        cat >> ~/.ssh/config << 'SSHCONFIG'
        Host deploy.eattable.kr
          ProxyCommand cloudflared access ssh --hostname %h
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
        SSHCONFIG

    - name: Diagnose (logs + status)
      run: |
        ssh -o ConnectTimeout=15 ${{ secrets.DEPLOY_USER }}@deploy.eattable.kr << 'EOF'
          echo "=== 부팅 시 마이그레이션 로그 ==="
          docker logs eattable-app 2>&1 | grep -iE "migration|마이그레이션" | tail -20 || true
          echo ""
          echo "=== 마이그레이션 상태 ==="
          docker exec eattable-app node server/migrations/runner.js --status || true
        EOF

    # 배경: 프로덕션 DB는 schema_migrations에 001~004만 기록된 채 운영돼 왔고,
    # 005가 분기된 구 스키마(advertisements 등)와 충돌해 runner가 거기서 멈춘다.
    # v2 코드가 요구하는 100~107은 전부 멱등(IF NOT EXISTS / ON CONFLICT)이므로
    # psql로 직접 적용하고 schema_migrations에 기록해 우회한다.
    - name: Recover v2 migrations (100~107 direct apply)
      if: ${{ inputs.recover_v2 }}
      run: |
        ssh -o ConnectTimeout=15 ${{ secrets.DEPLOY_USER }}@deploy.eattable.kr << 'OUTER'
          set -e

          # 앱 컨테이너의 node + 기존 DB 풀로 적용 (runner.js와 동일 경로 — psql/컨테이너명 불필요)
          cat > /tmp/recover-v2.js << 'NODEEOF'
        const fs = require('fs');
        const pool = require('/app/server/config/database');

        const FILES = [
          '100_create_pivot_v2_tables.sql',
          '101_fix_orders_table_conflict.sql',
          '102_seed_demo_restaurants.sql',
          '103_merchant_upgrade.sql',
          '104_ensure_columns.sql',
          '105_schema_drift_and_nts.sql',
          '106_operational_features.sql',
          '107_reservation_chat.sql',
        ];

        (async () => {
          for (const f of FILES) {
            const sql = fs.readFileSync('/app/server/migrations/' + f, 'utf8');
            const client = await pool.connect();
            try {
              await client.query('BEGIN');
              await client.query(sql);
              await client.query(
                'INSERT INTO schema_migrations (filename) VALUES ($1) ON CONFLICT (filename) DO NOTHING',
                [f]
              );
              await client.query('COMMIT');
              console.log('OK:', f);
            } catch (e) {
              await client.query('ROLLBACK');
              console.error('FAIL:', f, '-', e.message);
              process.exit(1);
            } finally {
              client.release();
            }
          }

          const cols = await pool.query(
            "SELECT column_name FROM information_schema.columns WHERE table_name='restaurants' AND column_name = ANY($1)",
            [['is_accepting_reservations', 'holidays', 'max_advance_days']]
          );
          console.log('검증 106 컬럼:', cols.rows.map((r) => r.column_name).join(', ') || '없음!');

          const chat = await pool.query("SELECT to_regclass('public.reservation_chat_rooms') AS t");
          console.log('검증 107 채팅 테이블:', chat.rows[0].t || '없음!');

          process.exit(0);
        })();
        NODEEOF

          docker cp /tmp/recover-v2.js eattable-app:/tmp/recover-v2.js
          docker exec eattable-app node /tmp/recover-v2.js

          echo "=== 적용 후 마이그레이션 상태 ==="
          docker exec eattable-app node server/migrations/runner.js --status || true

          echo "=== 헬스체크 ==="
          curl -s -o /dev/null -w "API health: %{http_code}\n" http://localhost:80/api/health
        OUTER

    # 최신 migrations 폴더를 RPi → 컨테이너에 주입 후 runner 실행 (전체 재배포 없이)
    - name: Sync migrations & apply
      if: ${{ inputs.sync_and_apply }}
      run: |
        # checkout한 최신 migrations를 RPi 임시 디렉토리로 전송
        rsync -az --delete \
          -e "ssh -o ProxyCommand='cloudflared access ssh --hostname deploy.eattable.kr' -o ConnectTimeout=15" \
          server/migrations/ \
          ${{ secrets.DEPLOY_USER }}@deploy.eattable.kr:/tmp/latest-migrations/

        ssh -o ConnectTimeout=15 ${{ secrets.DEPLOY_USER }}@deploy.eattable.kr << 'EOF'
          set -e
          echo "=== 컨테이너에 최신 migrations 주입 ==="
          docker cp /tmp/latest-migrations/. eattable-app:/app/server/migrations/

          echo "=== runner 실행 ==="
          docker exec eattable-app node server/migrations/runner.js

          echo "=== 적용 후 상태 ==="
          docker exec eattable-app node server/migrations/runner.js --status

          echo "=== 검증: users.is_blocked (108) ==="
          PG=$(docker ps --format '{{.Names}}' | grep -i postgres | head -1)
          docker exec "$PG" psql -U postgres -d honbabnono -c \
            "SELECT column_name FROM information_schema.columns WHERE table_name='users' AND column_name='is_blocked';"

          echo "=== 헬스체크 ==="
          curl -s -o /dev/null -w "API health: %{http_code}\n" http://localhost:80/api/health
        EOF

    - name: Apply migrations
      if: ${{ inputs.apply }}
      run: |
        ssh -o ConnectTimeout=15 ${{ secrets.DEPLOY_USER }}@deploy.eattable.kr << 'EOF'
          set -e
          echo "=== 마이그레이션 실행 ==="
          docker exec eattable-app node server/migrations/runner.js
          echo ""
          echo "=== 적용 후 상태 ==="
          docker exec eattable-app node server/migrations/runner.js --status
          echo ""
          echo "=== 헬스체크 ==="
          curl -s -o /dev/null -w "API: %{http_code}\n" http://localhost:80/api/health
        EOF
