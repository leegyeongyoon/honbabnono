name: Unit Tests (Required)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      # 유닛 테스트는 DB를 mock으로 사용 — 레포의 .env.test 그대로 사용 (RDS 가드 포함)
      - name: Run Unit Tests
        run: npm run test:unit
        env:
          NODE_ENV: test
          SKIP_DB_SETUP: 'true'
