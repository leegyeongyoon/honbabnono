name: Run Tests Only

on:
  workflow_dispatch:
  push:
    branches-ignore: [ main ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '20'

jobs:
  lint-and-unit:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Run unit tests
      run: npm run test:unit
      env:
        NODE_ENV: test
        SKIP_DB_SETUP: 'true'   # 유닛은 DB mock — 마이그레이션 부트스트랩 생략

  integration:
    name: Integration Tests (v2 풀플로우)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: honbabnono_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # DB 접속 정보는 개별 env로 주입 — database.js가 DATABASE_URL은 읽지 않음.
    # .env.test는 override:false 로드라 여기서 주입한 값이 우선한다.
    # 베이스 스키마 + 마이그레이션은 jest globalSetup이 자동 적용.
    - name: Run integration tests
      run: npm run test:integration
      env:
        NODE_ENV: test
        DB_HOST: localhost
        DB_PORT: '5432'
        DB_NAME: honbabnono_test
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_SSL: 'false'

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [lint-and-unit, integration]
    if: always()
    steps:
    - name: Summary
      run: |
        if [ "${{ needs.lint-and-unit.result }}" == "success" ] && [ "${{ needs.integration.result }}" == "success" ]; then
          echo "✅ lint + unit + integration 전부 통과 — 머지 가능"
        else
          echo "❌ 테스트 실패 — 머지 전 수정 필요 (unit: ${{ needs.lint-and-unit.result }}, integration: ${{ needs.integration.result }})"
          exit 1
        fi
