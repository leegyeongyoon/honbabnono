name: Deploy to Raspberry Pi

# GHCR 기반 배포: 빌드는 GitHub Actions(arm64 러너)에서, RPi는 이미지 pull만.
# 구 방식(RPi에서 docker build)은 ARM 빌드 중 SSH 끊김으로 반복 실패 → 폐기.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'terraform/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/deploy-admin.yml'
      - '.github/workflows/cost-check.yml'
      - '.github/workflows/cleanup.yml'
      - '.github/workflows/destroy.yml'
      - '.github/workflows/emergency-cleanup.yml'
      - '.github/workflows/deploy-rpi.yml'
      - '.github/workflows/stop-prod.yml'
      - '.github/workflows/daily-funnel-report.yml'
      - '.github/workflows/diagnose-deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-rpi
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/leegyeongyoon/eattable-app

jobs:
  # ── 1. 이미지 빌드 + GHCR push (클라우드 arm64 러너 — SSH 무관) ──
  build:
    name: Build & push image (arm64)
    runs-on: ubuntu-24.04-arm   # 퍼블릭 레포 무료 native arm64
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. RPi에서 pull + up (짧은 SSH 명령만 — 끊김 무관) ──
  deploy:
    name: Pull & restart on Raspberry Pi
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat >> ~/.ssh/config << 'SSHCONFIG'
          Host deploy.eattable.kr
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          SSHCONFIG

      - name: Sync compose file
        run: |
          # docker-compose.prod.yml → RPi ~/eattable/docker-compose.yml (image 기반)
          for attempt in 1 2 3; do
            rsync -az \
              -e "ssh -o ProxyCommand='cloudflared access ssh --hostname deploy.eattable.kr' -o ConnectTimeout=20" \
              docker-compose.prod.yml \
              ${{ secrets.DEPLOY_USER }}@deploy.eattable.kr:/home/gyoungyoon/eattable/docker-compose.yml \
              && break
            echo "rsync 재시도 $attempt..."; sleep 10
          done

      - name: Pull & restart (detached)
        run: |
          ssh_rpi() { ssh -o ConnectTimeout=20 ${{ secrets.DEPLOY_USER }}@deploy.eattable.kr "$1"; }
          # pull은 이미지 레이어 다운로드라 길어 SSH가 끊긴다(broken pipe). RPi에서 detach 실행 → 끊겨도 계속.
          # GHA는 짧은 SSH로 상태파일만 폴링한다.
          for attempt in 1 2 3; do
            if ssh_rpi 'rm -f /tmp/deploy.status /tmp/deploy.log; setsid bash -c "
              cd /home/gyoungyoon/eattable
              if docker compose pull app autoheal >> /tmp/deploy.log 2>&1 && \
                 docker compose up -d --remove-orphans >> /tmp/deploy.log 2>&1; then
                echo OK > /tmp/deploy.status
              else
                echo FAIL > /tmp/deploy.status
              fi
            " < /dev/null > /dev/null 2>&1 &'; then
              echo "배포를 백그라운드로 시작했습니다 (detached)."; break
            fi
            echo "시작 SSH 재시도 $attempt (터널 일시 장애)..."; sleep 15
          done

          echo "=== pull+up 완료 폴링 (최대 ~20분) ==="
          STATUS=""
          for i in $(seq 1 40); do
            sleep 30
            STATUS=$(ssh_rpi "cat /tmp/deploy.status 2>/dev/null" 2>/dev/null || echo "")
            echo "[$i/40] 상태: ${STATUS:-진행중}"
            if [ -n "$STATUS" ]; then break; fi
          done
          echo "=== 배포 로그(마지막 25줄) ==="
          ssh_rpi "tail -25 /tmp/deploy.log 2>/dev/null" || true
          if [ "$STATUS" != "OK" ]; then
            echo "::error::pull/up 실패(status=${STATUS:-timeout}). 기존 컨테이너는 유지됨(서비스 보호)."
            exit 1
          fi

          echo "=== 헬스체크 ==="
          for i in $(seq 1 12); do
            sleep 10
            code=$(ssh_rpi "curl -s -o /dev/null -w '%{http_code}' http://localhost:80/api/health" 2>/dev/null || echo "000")
            echo "[$i/12] API health: $code"
            if [ "$code" = "200" ]; then echo "Deploy SUCCESS"; exit 0; fi
          done
          echo "헬스체크 실패"; ssh_rpi "docker logs eattable-app --tail 30" || true; exit 1

      - name: Summary
        if: always()
        run: |
          echo "Image: ${{ env.IMAGE }}:${{ github.sha }}"
          echo "https://eattable.kr"
