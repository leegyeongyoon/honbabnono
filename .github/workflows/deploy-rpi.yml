name: Deploy to Raspberry Pi

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - 'terraform/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/deploy-admin.yml'
      - '.github/workflows/cost-check.yml'
      - '.github/workflows/cleanup.yml'
      - '.github/workflows/destroy.yml'
      - '.github/workflows/emergency-cleanup.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Raspberry Pi
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install cloudflared
      run: |
        curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
        sudo dpkg -i cloudflared.deb

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        cat >> ~/.ssh/config << 'SSHCONFIG'
        Host deploy.eattable.kr
          ProxyCommand cloudflared access ssh --hostname %h
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
        SSHCONFIG

    - name: Test SSH connection
      run: |
        ssh -o ConnectTimeout=15 ${{ secrets.DEPLOY_USER }}@deploy.eattable.kr 'echo "Connected to $(hostname)"'

    - name: Sync code
      run: |
        rsync -avz --delete \
          -e "ssh -o ProxyCommand='cloudflared access ssh --hostname deploy.eattable.kr'" \
          --exclude='node_modules' \
          --exclude='.git' \
          --exclude='ios' \
          --exclude='android' \
          --exclude='*.hwpx' \
          --exclude='*.docx' \
          --exclude='.env' \
          --exclude='.env.development' \
          --exclude='.env.test' \
          --exclude='merchant/node_modules' \
          --exclude='admin/node_modules' \
          ./ ${{ secrets.DEPLOY_USER }}@deploy.eattable.kr:/home/gyoungyoon/eattable/app/

    - name: Build and deploy
      run: |
        # 빌드를 RPi에서 detach 실행 (setsid) — ARM 풀빌드가 길어 SSH가 끊겨도(broken pipe) 빌드는 계속 진행.
        # GHA는 짧은 SSH로 상태 파일만 폴링한다.
        ssh -o ConnectTimeout=20 ${{ secrets.DEPLOY_USER }}@deploy.eattable.kr << 'EOF'
          cd /home/gyoungyoon/eattable
          rm -f /tmp/deploy-build.status /tmp/deploy-build.log
          setsid bash -c '
            cd /home/gyoungyoon/eattable
            echo "=== Docker build ===" > /tmp/deploy-build.log
            if docker compose build --no-cache app >> /tmp/deploy-build.log 2>&1 && \
               docker compose up -d --force-recreate app >> /tmp/deploy-build.log 2>&1; then
              echo OK > /tmp/deploy-build.status
            else
              echo FAIL > /tmp/deploy-build.status
            fi
          ' < /dev/null > /dev/null 2>&1 &
          echo "빌드를 백그라운드로 시작했습니다 (detached)."
        EOF

        echo "=== 빌드 완료 폴링 (최대 ~40분) ==="
        STATUS=""
        for i in $(seq 1 80); do
          sleep 30
          STATUS=$(ssh -o ConnectTimeout=20 ${{ secrets.DEPLOY_USER }}@deploy.eattable.kr "cat /tmp/deploy-build.status 2>/dev/null" || echo "")
          echo "[$i/80] 빌드 상태: ${STATUS:-진행중}"
          if [ -n "$STATUS" ]; then break; fi
        done

        echo "=== 빌드 로그 (마지막 30줄) ==="
        ssh -o ConnectTimeout=20 ${{ secrets.DEPLOY_USER }}@deploy.eattable.kr "tail -30 /tmp/deploy-build.log 2>/dev/null" || true

        if [ "$STATUS" != "OK" ]; then
          echo "Deploy FAILED (status=${STATUS:-timeout})"
          exit 1
        fi

        echo "=== 컨테이너 부팅 대기 + 헬스체크 ==="
        sleep 25
        HTTP=$(ssh -o ConnectTimeout=20 ${{ secrets.DEPLOY_USER }}@deploy.eattable.kr "curl -s -o /dev/null -w '%{http_code}' http://localhost:80/")
        API=$(ssh -o ConnectTimeout=20 ${{ secrets.DEPLOY_USER }}@deploy.eattable.kr "curl -s -o /dev/null -w '%{http_code}' http://localhost:80/api/health")
        echo "Web: $HTTP | API: $API"
        if [ "$HTTP" = "200" ] && [ "$API" = "200" ]; then
          echo "Deploy SUCCESS"
        else
          echo "Deploy WARNING - 헬스체크 실패"
          ssh -o ConnectTimeout=20 ${{ secrets.DEPLOY_USER }}@deploy.eattable.kr "docker logs eattable-app --tail 20" || true
          exit 1
        fi

    - name: Summary
      if: always()
      run: |
        echo "https://eattable.kr"
        echo "Commit: ${{ github.sha }}"
        echo "By: ${{ github.actor }}"
