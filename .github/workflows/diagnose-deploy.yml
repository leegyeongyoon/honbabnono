name: Diagnose Deploy (Manual)

# 프로덕션 RPi 배포 파이프라인 진단 (수동 트리거 전용)
# 배경: 배포는 성공하는데 백엔드(server) 코드 변경이 컨테이너에 반영 안 되는 정황.
#       rsync 경로(eattable/app/)와 docker compose 실행 경로(eattable/) 불일치 의심.
on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Diagnose on Raspberry Pi
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Install cloudflared
      run: |
        curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
        sudo dpkg -i cloudflared.deb

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        cat >> ~/.ssh/config << 'SSHCONFIG'
        Host deploy.eattable.kr
          ProxyCommand cloudflared access ssh --hostname %h
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
        SSHCONFIG

    - name: Diagnose deploy pipeline
      run: |
        ssh -o ConnectTimeout=15 ${{ secrets.DEPLOY_USER }}@deploy.eattable.kr << 'EOF'
          set +e
          echo "################ A. docker-compose.yml 전문 ################"
          cat /home/gyoungyoon/eattable/docker-compose.yml 2>/dev/null
          echo "################ B. .env.production 키 이름(값 숨김) ################"
          sed 's/=.*/=***/' /home/gyoungyoon/eattable/.env.production 2>/dev/null
          echo "################ C. nginx 디렉토리 ################"
          ls -la /home/gyoungyoon/eattable/nginx/ 2>/dev/null
          echo "################ D. docker login 상태 / GHCR 가능 여부 ################"
          cat ~/.docker/config.json 2>/dev/null | sed 's/"auth":.*/"auth":"***"/' | head -20
          echo "################ E. docker/아키텍처 ################"
          docker --version; uname -m
          echo ""
          echo "================ 1. 디렉토리 구조 ================"
          echo "--- ~/eattable ---"
          ls -la /home/gyoungyoon/eattable/ | head -20
          echo "--- ~/eattable/app (rsync 대상) ---"
          ls -la /home/gyoungyoon/eattable/app/ 2>/dev/null | head -20

          echo ""
          echo "================ 2. docker-compose.yml 위치/내용 ================"
          for f in /home/gyoungyoon/eattable/docker-compose.yml /home/gyoungyoon/eattable/app/docker-compose.yml; do
            if [ -f "$f" ]; then
              echo "--- 발견: $f ---"
              grep -nE "build|context|dockerfile|volumes|image|app:|\.:" "$f" | head -20
            fi
          done

          echo ""
          echo "================ 3. 호스트 코드의 menus/controller.js (rsync 결과) ================"
          for base in /home/gyoungyoon/eattable /home/gyoungyoon/eattable/app; do
            f="$base/server/modules/menus/controller.js"
            if [ -f "$f" ]; then
              echo "--- $f ---"
              grep -n "is_active\|includeInactive\|include_inactive" "$f" | head -5
            fi
          done

          echo ""
          echo "================ 4. 컨테이너 내부 코드 (실제 실행 중) ================"
          echo "--- 컨테이너 menus/controller.js의 is_active SELECT ---"
          docker exec eattable-app grep -n "m.sort_order, m.is_active\|includeInactive\|include_inactive" /app/server/modules/menus/controller.js 2>&1 | head -5
          echo "--- 컨테이너 이미지 빌드 시각 ---"
          docker inspect eattable-app --format '{{.Created}}' 2>&1
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Image}}" 2>&1

          echo ""
          echo "================ 5. 최신 커밋 마커 확인 ================"
          echo "--- 호스트 코드에 2f247eb 변경(include_inactive 주석) 있나 ---"
          grep -rn "점주 관리 화면은 품절" /home/gyoungyoon/eattable/server/modules/menus/controller.js /home/gyoungyoon/eattable/app/server/modules/menus/controller.js 2>/dev/null | head -2
          echo "--- 컨테이너 코드에 있나 ---"
          docker exec eattable-app grep -n "점주 관리 화면은 품절" /app/server/modules/menus/controller.js 2>&1 | head -2

          echo ""
          echo "================ 진단 끝 ================"
        EOF
